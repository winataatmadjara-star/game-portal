<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Minesweeper Adventure</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; }

html, body {
    width: 100%; height: 100%; overflow: hidden; position: fixed;
    background: #0a0e27; color: #fff; touch-action: none;
}
body { display: flex; justify-content: center; align-items: center; }

.bg-aurora {
    position: fixed; inset: 0; z-index: 0;
    background:
        radial-gradient(circle at 20% 30%, rgba(239, 68, 68, 0.15), transparent 50%),
        radial-gradient(circle at 80% 70%, rgba(34, 211, 238, 0.15), transparent 50%),
        radial-gradient(circle at 50% 50%, rgba(251, 191, 36, 0.1), transparent 60%);
    animation: auroraShift 14s ease-in-out infinite alternate;
}
@keyframes auroraShift {
    0%   { transform: scale(1) rotate(0deg); }
    100% { transform: scale(1.15) rotate(-3deg); }
}

.game-container {
    position: relative; z-index: 1;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 10px; padding: 10px; width: 100%; height: 100%;
}

.title {
    font-size: 1.5rem; font-weight: 800;
    background: linear-gradient(135deg, #ef4444, #fbbf24);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
    letter-spacing: 2px; text-transform: uppercase;
    filter: drop-shadow(0 0 12px rgba(239, 68, 68, 0.5));
}

.hud {
    display: flex; justify-content: space-between; align-items: center;
    width: 100%; max-width: 560px;
    background: rgba(15, 23, 42, 0.85);
    backdrop-filter: blur(10px);
    padding: 10px 14px; border-radius: 12px;
    font-size: 13px; font-weight: 600;
    border: 1px solid rgba(239, 68, 68, 0.25);
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
}
.hud-item { display: flex; flex-direction: column; align-items: center; gap: 2px; }
.hud-label { font-size: 10px; color: #94a3b8; text-transform: uppercase; letter-spacing: 1px; }
.hud-value { font-size: 16px; font-weight: 700; font-family: 'Courier New', monospace; }
.hud .mines .hud-value { color: #ef4444; }
.hud .flags .hud-value { color: #fbbf24; }
.hud .level .hud-value { color: #22d3ee; }
.hud .timer .hud-value { color: #4ade80; }

.level-progress {
    width: 100%; max-width: 560px; height: 6px;
    background: rgba(15, 23, 42, 0.85);
    border-radius: 3px; overflow: hidden;
    border: 1px solid rgba(239, 68, 68, 0.2);
}
.level-progress-fill {
    height: 100%; width: 0%;
    background: linear-gradient(90deg, #ef4444, #fbbf24);
    transition: width 0.3s ease;
    box-shadow: 0 0 10px rgba(251, 191, 36, 0.6);
}

.canvas-wrapper {
    position: relative; display: inline-block;
    padding: 12px;
    background: rgba(15, 23, 42, 0.9);
    border: 3px solid rgba(239, 68, 68, 0.4);
    border-radius: 16px;
    box-shadow: 0 0 40px rgba(239, 68, 68, 0.2), inset 0 0 60px rgba(0, 0, 0, 0.5);
}

canvas {
    display: block;
    background: #1e293b;
    border-radius: 10px;
    touch-action: none;
    cursor: pointer;
}

.overlay {
    position: absolute; top: 0; left: 0;
    width: 100%; height: 100%;
    background: rgba(10, 14, 39, 0.95);
    backdrop-filter: blur(10px);
    display: flex; flex-direction: column;
    justify-content: center; align-items: center;
    text-align: center;
    padding: 20px;
    z-index: 10;
    border-radius: 16px;
    animation: popIn 0.3s ease;
}
@keyframes popIn {
    from { opacity: 0; transform: scale(0.95); }
    to   { opacity: 1; transform: scale(1); }
}
.overlay.hidden { display: none; }

.overlay h1 {
    font-size: 1.8rem; margin-bottom: 12px;
    background: linear-gradient(135deg, #ef4444, #fbbf24);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
    letter-spacing: 1px;
}
.overlay h1.dead {
    background: linear-gradient(135deg, #ef4444, #f97316);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
}
.overlay h1.win {
    background: linear-gradient(135deg, #fbbf24, #22c55e);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
}

.overlay p {
    margin-bottom: 6px; font-size: 13px;
    color: #cbd5e1; line-height: 1.5;
    max-width: 340px;
}

.overlay .final-score {
    font-size: 2.2rem; font-weight: 800; color: #fbbf24;
    margin: 12px 0; text-shadow: 0 0 20px rgba(251, 191, 36, 0.6);
    font-family: 'Courier New', monospace;
}

.overlay button {
    padding: 12px 32px;
    background: linear-gradient(135deg, #ef4444, #f59e0b);
    color: #fff; border: none; border-radius: 10px;
    font-size: 15px; font-weight: 700; cursor: pointer;
    margin-top: 10px; transition: all 0.2s;
    letter-spacing: 0.5px;
    box-shadow: 0 4px 15px rgba(239, 68, 68, 0.4);
    position: relative;
    z-index: 20;
}
.overlay button:hover {
    transform: translateY(-2px) scale(1.03);
    box-shadow: 0 6px 25px rgba(239, 68, 68, 0.6);
}

.level-badge {
    display: inline-block;
    padding: 4px 14px;
    background: rgba(34, 211, 238, 0.2);
    border: 1px solid #22d3ee;
    border-radius: 20px;
    font-size: 11px;
    color: #22d3ee;
    font-weight: 700;
    margin-bottom: 10px;
    letter-spacing: 1px;
    text-transform: uppercase;
}

.level-toast {
    position: fixed; top: 18%; left: 50%;
    transform: translateX(-50%) scale(0);
    background: linear-gradient(135deg, #fbbf24, #22c55e);
    color: #0f172a; padding: 14px 28px; border-radius: 14px;
    font-size: 16px; font-weight: 800; letter-spacing: 1px;
    z-index: 100; box-shadow: 0 10px 40px rgba(251, 191, 36, 0.6);
    pointer-events: none; text-align: center;
}
.level-toast.show { animation: toastPop 2s ease forwards; }
@keyframes toastPop {
    0%   { transform: translateX(-50%) scale(0);   opacity: 0; }
    15%  { transform: translateX(-50%) scale(1.1); opacity: 1; }
    25%  { transform: translateX(-50%) scale(1);   opacity: 1; }
    85%  { transform: translateX(-50%) scale(1);   opacity: 1; }
    100% { transform: translateX(-50%) scale(0.9); opacity: 0; }
}

.controls-mobile {
    display: none;
    gap: 8px;
    margin-top: 4px;
}
.controls-mobile button {
    padding: 10px 18px;
    background: rgba(22, 33, 62, 0.9);
    color: #fbbf24;
    border: 2px solid #fbbf24;
    border-radius: 12px;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
}
.controls-mobile button:active {
    background: #fbbf24;
    color: #0f172a;
    transform: scale(0.92);
}

@media (max-width: 600px) {
    .title { font-size: 1.2rem; }
    .hud { max-width: 96vw; font-size: 11px; padding: 8px 10px; }
    .hud-value { font-size: 13px; }
    .controls-mobile { display: flex; }
    .overlay h1 { font-size: 1.4rem; }
    .overlay .final-score { font-size: 1.8rem; }
}
</style>
</head>
<body>

<div class="bg-aurora"></div>

<div class="game-container">
    <div class="title">💣 Minesweeper</div>

    <div class="hud">
        <div class="hud-item mines">
            <span class="hud-label">💣 Mines</span>
            <span class="hud-value" id="mineCount">10</span>
        </div>
        <div class="hud-item flags">
            <span class="hud-label">🚩 Flags</span>
            <span class="hud-value" id="flagCount">0</span>
        </div>
        <div class="hud-item level">
            <span class="hud-label">Level</span>
            <span class="hud-value" id="levelDisplay">1/10</span>
        </div>
        <div class="hud-item timer">
            <span class="hud-label">⏱ Time</span>
            <span class="hud-value" id="timer">00:00</span>
        </div>
    </div>

    <div class="level-progress">
        <div class="level-progress-fill" id="levelProgress"></div>
    </div>

    <div class="canvas-wrapper">
        <canvas id="gameCanvas" width="500" height="500"></canvas>

        <div id="overlay" class="overlay">
            <div class="level-badge" id="levelBadge">LEVEL 1 · 9×9 · 10 MINES</div>
            <h1>💣 Minesweeper</h1>
            <p><strong>10 Level</strong> dengan ukuran papan yang bertambah!</p>
            <p>🖱 <strong>Klik kiri</strong> untuk buka kotak</p>
            <p>🚩 <strong>Klik kanan</strong> untuk pasang bendera</p>
            <p>📱 Di mobile: <strong>tap</strong> untuk buka, <strong>tap lama</strong> untuk bendera</p>
            <button id="startBtn" type="button">▶ Mulai Bermain</button>
        </div>
    </div>

    <div class="controls-mobile">
        <button type="button" id="modeToggle">Mode: BUKA</button>
    </div>
</div>

<div id="toast" class="level-toast"></div>

<script>
// ============================================================
// MINESWEEPER ADVENTURE - 10 Level
// ============================================================

var canvas = document.getElementById('gameCanvas');
var ctx = canvas.getContext('2d');
var mineCountEl = document.getElementById('mineCount');
var flagCountEl = document.getElementById('flagCount');
var levelDisplay = document.getElementById('levelDisplay');
var timerEl = document.getElementById('timer');
var levelProgress = document.getElementById('levelProgress');
var overlay = document.getElementById('overlay');
var levelBadge = document.getElementById('levelBadge');
var startBtn = document.getElementById('startBtn');
var toast = document.getElementById('toast');
var modeToggle = document.getElementById('modeToggle');

// ============================================================
// 10 LEVEL: papan makin besar, mines makin banyak
// ============================================================
var LEVELS = [
    { cols: 9,  rows: 9,  mines: 10 },
    { cols: 9,  rows: 9,  mines: 15 },
    { cols: 10, rows: 10, mines: 18 },
    { cols: 10, rows: 10, mines: 22 },
    { cols: 12, rows: 12, mines: 28 },
    { cols: 12, rows: 12, mines: 35 },
    { cols: 14, rows: 14, mines: 45 },
    { cols: 14, rows: 14, mines: 55 },
    { cols: 16, rows: 16, mines: 65 },
    { cols: 16, rows: 16, mines: 80 }
];

var currentLevel = 1;
var COLS = 9;
var ROWS = 9;
var MINE_COUNT = 10;

var board = [];        // { mine, revealed, flagged, adjacent }
var gameState = 'ready';  // ready | playing | won | lost
var firstClick = true;
var revealedCount = 0;
var flagCount = 0;
var startTime = 0;
var elapsed = 0;
var timerInterval = null;

var CELL_SIZE = 40;
var PADDING = 4;
var BOARD_OFFSET_X = 0;
var BOARD_OFFSET_Y = 0;

var isRunning = false;
var mobileMode = 'reveal'; // 'reveal' | 'flag'

// ============================================================
// AUDIO
// ============================================================
var audioCtx = null;
function initAudio() {
    if (!audioCtx) {
        try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
        catch (e) { audioCtx = null; }
    }
}
function playSound(freq, duration, type, volume) {
    type = type || 'sine';
    volume = volume || 0.06;
    if (!audioCtx) return;
    try {
        var osc = audioCtx.createOscillator();
        var gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.value = freq;
        gain.gain.value = volume;
        gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
    } catch (e) {}
}
var SFX = {
    click: function() { playSound(500, 0.04, 'sine', 0.04); },
    flag: function() { playSound(700, 0.06, 'square', 0.05); },
    explode: function() { [200, 150, 100, 80].forEach(function(f, i) { setTimeout(function() { playSound(f, 0.15, 'sawtooth', 0.1); }, i * 80); }); },
    win: function() { [523, 659, 784, 1047].forEach(function(f, i) { setTimeout(function() { playSound(f, 0.15); }, i * 100); }); },
    levelUp: function() { [523, 659, 784, 1047, 1319].forEach(function(f, i) { setTimeout(function() { playSound(f, 0.15); }, i * 100); }); }
};

// ============================================================
// FIT CANVAS
// ============================================================
function fitCanvas() {
    var cfg = LEVELS[Math.min(currentLevel - 1, LEVELS.length - 1)];
    var maxW = Math.min(window.innerWidth - 40, 560);
    var maxH = Math.min(window.innerHeight - 260, 560);

    var cellByW = (maxW - PADDING * (cfg.cols + 1)) / cfg.cols;
    var cellByH = (maxH - PADDING * (cfg.rows + 1)) / cfg.rows;
    CELL_SIZE = Math.floor(Math.min(cellByW, cellByH, 44));
    if (CELL_SIZE < 16) CELL_SIZE = 16;

    var boardW = CELL_SIZE * cfg.cols + PADDING * (cfg.cols + 1);
    var boardH = CELL_SIZE * cfg.rows + PADDING * (cfg.rows + 1);

    canvas.width = boardW;
    canvas.height = boardH;
    canvas.style.width = boardW + 'px';
    canvas.style.height = boardH + 'px';

    BOARD_OFFSET_X = 0;
    BOARD_OFFSET_Y = 0;

    if (board.length > 0) draw();
}
window.addEventListener('resize', fitCanvas);
window.addEventListener('orientationchange', function() { setTimeout(fitCanvas, 200); });

// ============================================================
// HIGH SCORE
// ============================================================
function formatTime(sec) {
    var m = Math.floor(sec / 60);
    var s = sec % 60;
    return (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s;
}

function startTimer() {
    startTime = Date.now();
    clearInterval(timerInterval);
    timerInterval = setInterval(function() {
        if (gameState === 'playing') {
            elapsed = Math.floor((Date.now() - startTime) / 1000);
            timerEl.textContent = formatTime(elapsed);
        }
    }, 500);
}

function stopTimer() {
    clearInterval(timerInterval);
    timerInterval = null;
}

// ============================================================
// LEVEL HELPERS
// ============================================================
function getLevelConfig() {
    return LEVELS[Math.min(currentLevel - 1, LEVELS.length - 1)];
}

function updateLevelUI() {
    levelDisplay.textContent = currentLevel + '/10';
    var cfg = getLevelConfig();
    levelBadge.textContent = 'LEVEL ' + currentLevel + ' · ' + cfg.cols + '×' + cfg.rows + ' · ' + cfg.mines + ' MINES';
    mineCountEl.textContent = cfg.mines;
    flagCountEl.textContent = flagCount;
    var progress = (currentLevel - 1) / 10 * 100;
    levelProgress.style.width = progress + '%';
}

function showToast(text) {
    toast.textContent = text;
    toast.classList.remove('show');
    void toast.offsetWidth;
    toast.classList.add('show');
}

// ============================================================
// INIT BOARD
// ============================================================
function initBoard() {
    var cfg = getLevelConfig();
    COLS = cfg.cols;
    ROWS = cfg.rows;
    MINE_COUNT = cfg.mines;

    board = [];
    for (var r = 0; r < ROWS; r++) {
        var row = [];
        for (var c = 0; c < COLS; c++) {
            row.push({ mine: false, revealed: false, flagged: false, adjacent: 0 });
        }
        board.push(row);
    }

    firstClick = true;
    revealedCount = 0;
    flagCount = 0;
    elapsed = 0;
    gameState = 'ready';
    timerEl.textContent = '00:00';

    updateLevelUI();
    fitCanvas();
    draw();
}

function placeMines(safeR, safeC) {
    var placed = 0;
    var safeCells = [];
    // Area aman: 3x3 di sekitar klik pertama
    for (var dr = -1; dr <= 1; dr++) {
        for (var dc = -1; dc <= 1; dc++) {
            safeCells.push({ r: safeR + dr, c: safeC + dc });
        }
    }
    function isSafe(r, c) {
        return safeCells.some(function(s) { return s.r === r && s.c === c; });
    }

    while (placed < MINE_COUNT) {
        var r = Math.floor(Math.random() * ROWS);
        var c = Math.floor(Math.random() * COLS);
        if (board[r][c].mine) continue;
        if (isSafe(r, c)) continue;
        board[r][c].mine = true;
        placed++;
    }

    // Hitung adjacent
    for (var r2 = 0; r2 < ROWS; r2++) {
        for (var c2 = 0; c2 < COLS; c2++) {
            if (board[r2][c2].mine) continue;
            var count = 0;
            for (var dr2 = -1; dr2 <= 1; dr2++) {
                for (var dc2 = -1; dc2 <= 1; dc2++) {
                    if (dr2 === 0 && dc2 === 0) continue;
                    var nr = r2 + dr2;
                    var nc = c2 + dc2;
                    if (nr >= 0 && nr < ROWS && nc >= 0 && nc < COLS && board[nr][nc].mine) count++;
                }
            }
            board[r2][c2].adjacent = count;
        }
    }
}

// ============================================================
// REVEAL
// ============================================================
function revealCell(r, c) {
    if (r < 0 || r >= ROWS || c < 0 || c >= COLS) return;
    var cell = board[r][c];
    if (cell.revealed || cell.flagged) return;

    cell.revealed = true;
    revealedCount++;

    if (cell.mine) {
        gameState = 'lost';
        stopTimer();
        SFX.explode();
        draw();
        setTimeout(function() { gameOver('Menabrak ranjau!'); }, 600);
        return;
    }

    // Flood fill jika 0
    if (cell.adjacent === 0) {
        for (var dr = -1; dr <= 1; dr++) {
            for (var dc = -1; dc <= 1; dc++) {
                if (dr === 0 && dc === 0) continue;
                revealCell(r + dr, c + dc);
            }
        }
    }
}

function checkWin() {
    if (revealedCount === ROWS * COLS - MINE_COUNT) {
        gameState = 'won';
        stopTimer();
        SFX.levelUp();
        nextLevel();
    }
}

// ============================================================
// FLAG
// ============================================================
function toggleFlag(r, c) {
    var cell = board[r][c];
    if (cell.revealed) return;

    if (cell.flagged) {
        cell.flagged = false;
        flagCount--;
    } else {
        if (flagCount >= MINE_COUNT) return;
        cell.flagged = true;
        flagCount++;
    }
    flagCountEl.textContent = flagCount;
    SFX.flag();
    draw();
}

// ============================================================
// INIT GAME
// ============================================================
function initGame() {
    initAudio();
    currentLevel = 1;
    overlay.classList.add('hidden');
    isRunning = true;
    initBoard();
}

// ============================================================
// NEXT LEVEL
// ============================================================
function nextLevel() {
    if (currentLevel >= 10) {
        winGame();
        return;
    }

    var next = currentLevel + 1;
    showToast('🎉 LEVEL ' + next + '!');

    setTimeout(function() {
        currentLevel = next;
        initBoard();
    }, 1500);
}

// ============================================================
// DRAW
// ============================================================
function draw() {
    if (!board || board.length === 0) return;

    ctx.clearRect(0, 0, canvas.width, canvas.height);

    var colors = {
        0: '#64748b',
        1: '#3b82f6',
        2: '#22c55e',
        3: '#ef4444',
        4: '#a855f7',
        5: '#f59e0b',
        6: '#06b6d4',
        7: '#ec4899',
        8: '#94a3b8'
    };

    for (var r = 0; r < ROWS; r++) {
        for (var c = 0; c < COLS; c++) {
            var cell = board[r][c];
            var x = PADDING + c * (CELL_SIZE + PADDING);
            var y = PADDING + r * (CELL_SIZE + PADDING);

            if (cell.revealed) {
                // Sel terbuka
                ctx.fillStyle = cell.mine ? '#7f1d1d' : '#334155';
                roundRect(x, y, CELL_SIZE, CELL_SIZE, 4);
                ctx.fill();

                if (cell.mine) {
                    // Bom
                    ctx.fillStyle = '#ef4444';
                    ctx.font = 'bold ' + (CELL_SIZE * 0.6) + 'px sans-serif';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText('💣', x + CELL_SIZE / 2, y + CELL_SIZE / 2 + 1);
                } else if (cell.adjacent > 0) {
                    // Angka
                    ctx.fillStyle = colors[cell.adjacent] || '#fff';
                    ctx.font = 'bold ' + (CELL_SIZE * 0.55) + 'px "Segoe UI", sans-serif';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText(cell.adjacent, x + CELL_SIZE / 2, y + CELL_SIZE / 2 + 1);
                }
            } else {
                // Sel tertutup
                var grad = ctx.createLinearGradient(x, y, x, y + CELL_SIZE);
                grad.addColorStop(0, '#475569');
                grad.addColorStop(1, '#334155');
                ctx.fillStyle = grad;
                roundRect(x, y, CELL_SIZE, CELL_SIZE, 4);
                ctx.fill();

                // Highlight
                ctx.fillStyle = 'rgba(255, 255, 255, 0.15)';
                roundRect(x, y, CELL_SIZE, 3, 4);
                ctx.fill();

                if (cell.flagged) {
                    ctx.font = 'bold ' + (CELL_SIZE * 0.55) + 'px sans-serif';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText('🚩', x + CELL_SIZE / 2, y + CELL_SIZE / 2 + 1);
                }
            }

            // Border sel
            ctx.strokeStyle = 'rgba(0, 0, 0, 0.3)';
            ctx.lineWidth = 1;
            roundRect(x, y, CELL_SIZE, CELL_SIZE, 4);
            ctx.stroke();
        }
    }
}

function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
}

// ============================================================
// GAME OVER
// ============================================================
function gameOver(reason) {
    isRunning = false;
    stopTimer();

    // Tampilkan semua bom
    for (var r = 0; r < ROWS; r++) {
        for (var c = 0; c < COLS; c++) {
            if (board[r][c].mine) board[r][c].revealed = true;
        }
    }
    draw();

    overlay.classList.remove('hidden');
    overlay.innerHTML =
        '<div class="level-badge">LEVEL ' + currentLevel + ' · ' + getLevelConfig().cols + '×' + getLevelConfig().rows + '</div>' +
        '<h1 class="dead">💥 GAME OVER</h1>' +
        '<p>' + (reason || 'Coba lagi!') + '</p>' +
        '<p>Waktu: ' + formatTime(elapsed) + '</p>' +
        '<button id="restartBtn" type="button">🔄 Main Lagi</button>';

    document.getElementById('restartBtn').addEventListener('click', initGame);
    saveScore(elapsed);
}

// ============================================================
// WIN GAME
// ============================================================
function winGame() {
    isRunning = false;
    stopTimer();
    SFX.win();

    overlay.classList.remove('hidden');
    overlay.innerHTML =
        '<div class="level-badge">🏆 SEMUA LEVEL SELESAI</div>' +
        '<h1 class="win">🏆 YOU WIN!</h1>' +
        '<p>Kamu menaklukkan semua 10 level!</p>' +
        '<p>Total waktu: ' + formatTime(elapsed) + '</p>' +
        '<button id="restartBtn" type="button">🔄 Main Lagi</button>';

    document.getElementById('restartBtn').addEventListener('click', initGame);
    saveScore(elapsed);
}

// ============================================================
// SAVE SCORE
// ============================================================
function saveScore(seconds) {
    // Untuk minesweeper, skor = waktu (makin cepat makin baik)
    // Kita kirim sebagai "score" dengan konversi: 10000 - seconds*10
    // sehingga skor tinggi = cepat
    var finalScore = Math.max(100, 10000 - seconds * 10);
    if (finalScore <= 0) return;
    fetch('/api/scores', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ slug: 'minesweeper', score: finalScore })
    }).catch(function() {});
}

// ============================================================
// INPUT - MOUSE
// ============================================================
function getCellFromMouse(clientX, clientY) {
    var rect = canvas.getBoundingClientRect();
    var scaleX = canvas.width / rect.width;
    var scaleY = canvas.height / rect.height;

    var x = (clientX - rect.left) * scaleX;
    var y = (clientY - rect.top) * scaleY;

    var c = Math.floor((x - PADDING) / (CELL_SIZE + PADDING));
    var r = Math.floor((y - PADDING) / (CELL_SIZE + PADDING));

    if (r < 0 || r >= ROWS || c < 0 || c >= COLS) return null;
    return { r: r, c: c };
}

canvas.addEventListener('click', function(e) {
    if (gameState === 'won' || gameState === 'lost') return;
    if (!isRunning) return;

    var cell = getCellFromMouse(e.clientX, e.clientY);
    if (!cell) return;

    if (firstClick) {
        placeMines(cell.r, cell.c);
        firstClick = false;
        gameState = 'playing';
        startTimer();
    }

    if (mobileMode === 'flag' && ('ontouchstart' in window)) {
        toggleFlag(cell.r, cell.c);
    } else {
        var target = board[cell.r][cell.c];
        if (target.flagged) return;
        if (!target.revealed) {
            SFX.click();
            revealCell(cell.r, cell.c);
            draw();
            checkWin();
        }
    }
});

canvas.addEventListener('contextmenu', function(e) {
    e.preventDefault();
    if (gameState !== 'playing') return;
    if (!isRunning) return;

    var cell = getCellFromMouse(e.clientX, e.clientY);
    if (!cell) return;
    toggleFlag(cell.r, cell.c);
});

// ============================================================
// INPUT - TOUCH (long press = flag)
// ============================================================
var touchTimer = null;
var touchStartPos = null;
var touchMoved = false;

canvas.addEventListener('touchstart', function(e) {
    if (e.touches.length !== 1) return;
    touchMoved = false;
    var t = e.touches[0];
    touchStartPos = { x: t.clientX, y: t.clientY };

    clearTimeout(touchTimer);
    touchTimer = setTimeout(function() {
        if (!touchMoved && gameState === 'playing') {
            var cell = getCellFromMouse(touchStartPos.x, touchStartPos.y);
            if (cell) toggleFlag(cell.r, cell.c);
        }
    }, 400);
}, { passive: true });

canvas.addEventListener('touchmove', function(e) {
    if (!touchStartPos) return;
    var t = e.touches[0];
    var dx = t.clientX - touchStartPos.x;
    var dy = t.clientY - touchStartPos.y;
    if (Math.sqrt(dx * dx + dy * dy) > 10) {
        touchMoved = true;
        clearTimeout(touchTimer);
    }
}, { passive: true });

canvas.addEventListener('touchend', function(e) {
    clearTimeout(touchTimer);
    if (touchMoved || !touchStartPos) { touchStartPos = null; return; }
    if (gameState === 'won' || gameState === 'lost') { touchStartPos = null; return; }
    if (!isRunning) { touchStartPos = null; return; }

    var cell = getCellFromMouse(touchStartPos.x, touchStartPos.y);
    touchStartPos = null;
    if (!cell) return;

    if (firstClick) {
        placeMines(cell.r, cell.c);
        firstClick = false;
        gameState = 'playing';
        startTimer();
    }

    var target = board[cell.r][cell.c];
    if (target.flagged) return;
    if (!target.revealed) {
        SFX.click();
        revealCell(cell.r, cell.c);
        draw();
        checkWin();
    }
}, { passive: true });

// ============================================================
// MOBILE MODE TOGGLE
// ============================================================
if (modeToggle) {
    modeToggle.addEventListener('click', function() {
        mobileMode = mobileMode === 'reveal' ? 'flag' : 'reveal';
        modeToggle.textContent = 'Mode: ' + (mobileMode === 'reveal' ? 'BUKA' : 'BENDERA');
    });
}

// ============================================================
// START
// ============================================================
startBtn.addEventListener('click', initGame);

// ============================================================
// BOOT
// ============================================================
fitCanvas();
</script>
